name: WeatherVote
version: '2.0.0'
main: pl.slawcio.weathervote.WeatherVotePlugin
author: slawek
description: Lightweight weather and time voting for Spigot/Paper servers.
api-version: '1.13'

commands:
  vot:
    description: Start a weather/time vote or cast your vote.
    usage: "/vot <Day|Night|Sun|Rain|Storm|Yes|No>"
    aliases: [weathervote, wv]

permissions:
  weathervote.vote.start:
    description: Allows starting weather and time votes.
    default: true
  weathervote.vote.place:
    description: Allows casting a vote.
    default: true
  weathervote.admin:
    description: Allows reloading WeatherVote configuration and language files.
    default: op

  # Legacy permissions kept for existing installations.
  voting.vote.start:
    description: Legacy permission for starting votes.
    default: false
  voting.vote.place:
    description: Legacy permission for casting votes.
    default: false
