# Available languages: pl, eng ("en" is also accepted as an alias for eng)
language: pl

Round:
  # Vote duration in seconds.
  Duration: 30
  # Minimum number of players online required to start a vote.
  MinPlayers: 1
  Pause:
    Active: true
    CategoryList:
      # Cooldowns are in seconds and are shared by vote category.
      DAY_LIGHT:
        Duration: 540
      CLIMATE:
        Duration: 540

# Empty list = all NORMAL worlds.
# Example: ["world", "survival"]
Worlds: []

Visual:
  BossBar:
    Active: true
    Color: BLUE
    Style: SEGMENTED_20
  ActionBar:
    Active: true
  InteractiveChat:
    # Show clickable YES / NO buttons in chat when a vote starts.
    Active: true
